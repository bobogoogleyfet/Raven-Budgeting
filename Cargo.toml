[workspace]
resolver = "3"
members = [
    "crates/accounting-core",
    "crates/accounting-cli",
    # Requires the webkit2gtk-4.1 / javascriptcoregtk-4.1 / libsoup-3.0
    # development headers, because that is what `tauri`'s build script links
    # against. Without them this member does not merely fail to build — it
    # stops `cargo test --workspace` from resolving at all, taking the core's
    # tests down with it. The README has the apt line.
    "crates/accounting-tauri",
]

[workspace.package]
edition = "2024"
# Raised from 1.88 at M2: rusqlite_migration 2.6 declares rust-version 1.95.
# Leaving 1.88 here is not harmless — under resolver "3" cargo prefers
# dependency versions compatible with the declared MSRV, so an understated
# value invites a silent downgrade to rusqlite_migration 2.5, which wants
# rusqlite ^0.39 and therefore a *second* libsqlite3-sys and a duplicate-symbol
# link failure. The toolchain is pinned to 1.97.1 in rust-toolchain.toml.
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/tanner/personal_accounting"

[workspace.dependencies]
accounting-core = { path = "crates/accounting-core" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
uuid = { version = "1.24", features = ["v7", "serde"] }

# rusqlite 0.40 <-> rusqlite_migration 2.6 is the ONLY valid pair.
# 2.5 requires rusqlite ^0.39; a mismatch pulls two libsqlite3-sys versions
# and fails to link with duplicate sqlite3_* symbols.
rusqlite = { version = "0.40", features = ["bundled", "chrono", "uuid", "backup"] }
rusqlite_migration = "2.6"

# NEVER enable the "zlib" feature: it pulls a C compiler dependency and breaks
# the aarch64-linux-android / aarch64-apple-ios builds.
rust_xlsxwriter = { version = "0.97.1", default-features = false, features = ["chrono", "serde"] }
csv = "1.4"

clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

proptest = "1.11"
insta = "1.48"
tempfile = "3.27"
# CLI black-box tests. `assert_cmd` locates the built `pacc` binary itself, so
# the tests exercise the real argument parsing rather than a library shim.
assert_cmd = "2.0"
predicates = "3.1"

# Bundled SQLite is C; compiling it unoptimized makes debug test runs crawl.
[profile.dev.package.libsqlite3-sys]
opt-level = 2
