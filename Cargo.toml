[workspace]
resolver = "3"
members = [
    "crates/accounting-core",
    "crates/accounting-cli",
    # The Flutter frontend's bridge crate. A `cdylib`, so `cargo build` alone
    # proves nothing about the app — cargokit builds it again from Flutter's
    # own build, and only `flutter build linux` links it against the bundle.
    "app/rust",
]

[workspace.package]
edition = "2024"
# Raised from 1.88 at M2: rusqlite_migration 2.6 declares rust-version 1.95.
# Leaving 1.88 here is not harmless — under resolver "3" cargo prefers
# dependency versions compatible with the declared MSRV, so an understated
# value invites a silent downgrade to rusqlite_migration 2.5, which wants
# rusqlite ^0.39 and therefore a *second* libsqlite3-sys and a duplicate-symbol
# link failure. The toolchain is pinned to 1.97.1 in rust-toolchain.toml.
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/tanner/personal_accounting"

[workspace.dependencies]
accounting-core = { path = "crates/accounting-core" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
uuid = { version = "1.24", features = ["v7", "serde"] }

# rusqlite 0.40 <-> rusqlite_migration 2.6 is the ONLY valid pair.
# 2.5 requires rusqlite ^0.39; a mismatch pulls two libsqlite3-sys versions
# and fails to link with duplicate sqlite3_* symbols.
rusqlite = { version = "0.40", features = ["bundled", "chrono", "uuid", "backup"] }
rusqlite_migration = "2.6"

# NEVER enable the "zlib" feature: it pulls a C compiler dependency and breaks
# the aarch64-linux-android / aarch64-apple-ios builds.
rust_xlsxwriter = { version = "0.97.1", default-features = false, features = ["chrono", "serde"] }
csv = "1.4"

# Reading the Utah Tax Commission's quarterly rate workbook. Both are already
# in the tree (rust_xlsxwriter pulls them), so this adds a direct edge, not a
# build.
#
# `default-features = false` is load-bearing: zip's defaults turn on bzip2,
# zstd, lzma and xz, every one of which compiles C and breaks the Android and
# iOS targets. An xlsx is Deflate or Store, so `deflate-flate2` is the whole
# requirement — and flate2's own default is pure-Rust miniz_oxide, which is why
# the "never enable zlib" rule above is not violated by depending on it.
zip = { version = "8.6", default-features = false, features = ["deflate-flate2"] }
quick-xml = "0.41"

clap = { version = "4", features = ["derive"] }
anyhow = "1"

# Downloading the quarterly rate workbook. A *frontend* dependency: the core
# does no networking, because an HTTP client is exactly the sort of thing that
# differs between a desktop binary and an Android service.
#
# Blocking on purpose. The alternative would drag tokio into the CLI to await a
# single 260KB GET that happens four times a year, and the desktop app can put
# a blocking call on a thread far more cheaply than the core can grow a
# runtime. rustls rather than the platform's TLS, so the Android and iOS builds
# do not each need their own answer.
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

proptest = "1.11"
insta = "1.48"
tempfile = "3.27"
# CLI black-box tests. `assert_cmd` locates the built `pacc` binary itself, so
# the tests exercise the real argument parsing rather than a library shim.
assert_cmd = "2.0"
predicates = "3.1"

# The bridge turns a Rust panic into a Dart `PanicException` by catching the
# unwind, and the generated FFI decoders contain their own `unwrap()`s. Under
# `panic = "abort"` the process would die at the panic site instead, so that
# setting must never appear here.
[profile.release]
# Neither cargokit nor the Flutter tooling strips, and the frb template ships
# no release profile at all, so without this we inherit Cargo's defaults and
# ship the debug symbols of a bundled SQLite.
strip = "symbols"

# Bundled SQLite is C; compiling it unoptimized makes debug test runs crawl.
[profile.dev.package.libsqlite3-sys]
opt-level = 2
