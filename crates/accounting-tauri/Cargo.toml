[package]
name = "accounting-tauri"
version = "0.1.0"
description = "Tauri desktop shell. Renders accounting-core; contains no business logic."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "accounting"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
accounting-core.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
ureq.workspace = true
tauri = { version = "2.11.5", features = [] }

[lints.rust]
unsafe_code = "forbid"
