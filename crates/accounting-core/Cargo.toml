[package]
name = "accounting-core"
version = "0.1.0"
description = "Domain model, storage, and export for the personal accounting app. No UI."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
# The sync bundle's payloads. An entity's body crosses as JSON this crate does
# not interpret, so that a bundle written by an older release stays readable
# when a newer one adds a column — see `sync::bundle`. Was a dev-dependency
# until M8; the sync module is the first non-test user.
serde_json.workspace = true
thiserror.workspace = true
chrono.workspace = true
rusqlite.workspace = true
rusqlite_migration.workspace = true
uuid.workspace = true
rust_xlsxwriter.workspace = true
csv.workspace = true
zip.workspace = true
quick-xml.workspace = true
chacha20poly1305.workspace = true
argon2.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
# Hashes the shipped migration SQL so an edit to an already-applied migration
# fails the test suite instead of silently diverging fresh DBs from existing
# ones. See crates/accounting-core/tests/migrations.rs.
sha2 = "0.10"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# Money must never silently lose precision.
cast_possible_truncation = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"
float_arithmetic = "warn"
