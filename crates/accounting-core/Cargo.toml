[package]
name = "accounting-core"
version = "0.1.0"
description = "Domain model, storage, and export for the personal accounting app. No UI."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
thiserror.workspace = true
chrono.workspace = true
rusqlite.workspace = true
rusqlite_migration.workspace = true
uuid.workspace = true
rust_xlsxwriter.workspace = true
csv.workspace = true

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true
tempfile.workspace = true
# Hashes the shipped migration SQL so an edit to an already-applied migration
# fails the test suite instead of silently diverging fresh DBs from existing
# ones. See crates/accounting-core/tests/migrations.rs.
sha2 = "0.10"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# Money must never silently lose precision.
cast_possible_truncation = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"
float_arithmetic = "warn"
